name: conformance

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build portable bundle
        run: bash build.sh
      - name: Run conformance (Node)
        run: bash run.sh
      - name: Build CLI
        run: bash cli/cli-build.sh
